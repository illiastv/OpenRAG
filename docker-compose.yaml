version: '3.8'

services:
  backend:
    build: ./backend
    container_name: openrag_backend
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - openrag_network

  frontend:
    build: ./frontend
    container_name: openrag_frontend
    restart: always
    ports:
      - "5555:80"
    depends_on:
      - backend
    networks:
      - openrag_network

networks:
  openrag_network:
    driver: bridge